name: civicai

services:
  db:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicai
      POSTGRES_USER: civicai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      civicai_private:
        ipv4_address: 172.28.0.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicai -d civicai"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &bounded_logs
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  evidence-init:
    image: alpine:3.23
    command: ["sh", "-c", "chown -R 10001:10001 /evidence && chmod 0700 /evidence"]
    volumes:
      - evidence_data:/evidence
    restart: "no"

  migrate:
    build: {context: ., dockerfile: Dockerfile}
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://civicai:${POSTGRES_PASSWORD}@db:5432/civicai
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    networks: [civicai_private]
    restart: "no"

  backend:
    build: {context: ., dockerfile: Dockerfile}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://civicai:${POSTGRES_PASSWORD}@db:5432/civicai
      UPLOAD_DIR: /var/lib/civicai/evidence
      MAPTILER_REQUEST_ORIGIN: https://${CIVICAI_SITE_ADDRESS}
    volumes:
      - evidence_data:/var/lib/civicai/evidence
    depends_on:
      db: {condition: service_healthy}
      evidence-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    networks:
      civicai_private:
        ipv4_address: 172.28.0.20
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *bounded_logs

  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
      args:
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:-${MAPTILER_API_KEY:?Set MAPTILER_API_KEY in .env.production}}
    restart: unless-stopped
    environment:
      CIVICAI_SITE_ADDRESS: ${CIVICAI_SITE_ADDRESS:?Set CIVICAI_SITE_ADDRESS in .env.production}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: {condition: service_healthy}
    networks:
      civicai_private:
        ipv4_address: 172.28.0.10
    logging: *bounded_logs

networks:
  civicai_private:
    ipam:
      config: [{subnet: 172.28.0.0/24}]

volumes:
  postgres_data:
  evidence_data:
  caddy_data:
  caddy_config:
