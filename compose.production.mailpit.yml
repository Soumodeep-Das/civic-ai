name: civicai

# Local verification override only. Never include this file in a real deployment.
# The web inbox binds to loopback and SMTP remains private to the Compose network.
services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [civicai_private]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  backend:
    environment:
      EMAIL_TRANSPORT: smtp
      EMAIL_FROM: no-reply@civicai.local
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_STARTTLS: "false"
    depends_on:
      mailpit: {condition: service_started}

